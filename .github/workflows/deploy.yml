name: Build and Deploy Astro to DreamHost FTP

on:
  push:
    branches:
      - main # Change to 'master' if your main branch is named master

jobs:
  web-deploy:
    name: Build and Sync to FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm" # Or 'pnpm' / 'yarn' depending on your package manager

      - name: 📥 Install dependencies
        run: npm ci # Use pnpm i or yarn install if needed

      - name: 🔨 Build Astro project
        run: npm run build

      - name: 📂 Sync files to DreamHost FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: ./dist/
          remote_dir: ./launchpointzero.com # Replace with your target folder on DreamHost
