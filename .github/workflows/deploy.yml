name: Build and Deploy Astro to DreamHost

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Sync over SSH
    runs-on: ubuntu-latest
    environment: lpz_dreamhost
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm" # Or 'pnpm' / 'yarn' depending on your package manager

      - name: 📥 Install dependencies
        run: npm ci # Use pnpm i or yarn install if needed

      - name: 🔨 Build Astro project
        run: npm run build

      - name: 📂 Sync files to DreamHost over SSH
        uses: SamKirkland/web-deploy@v1
        with:
          target-server: ${{ secrets.SSH_HOST }}
          remote-user: ${{ secrets.SSH_USER }}
          private-ssh-key: ${{ secrets.SSH_KEY_ED25519_PRIVATE }}
          source-path: ./dist/
          destination-path: ~/launchpointzero.com/
          ssh-port: 22
