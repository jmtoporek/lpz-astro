name: Build and Deploy Astro to DreamHost (SSH)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-deploy:
    name: Build and Sync over SSH
    runs-on: ubuntu-latest
    environment: lpz_dreamhost
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro project
        run: npm run build

      - name: Configure SSH and deploy to DreamHost
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY_ED25519_PRIVATE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          ssh-keyscan -H -p 22 "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          rsync --archive --compress --delete \
            -e "ssh -p 22" \
            ./dist/ \
            "$SSH_USER@$SSH_HOST:~/launchpointzero.com/"
